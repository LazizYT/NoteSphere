<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background premium dark indigo gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <!-- Neon glowing outline gradient for Sphere -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing sphere body gradient -->
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Subtle document icon gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    
    <!-- Drop shadow filter for professional depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Complete fill for Android Maskable layout requirement (No transparent corners or margins, safe padding is key!) -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Safe padded orbit container (Scaled down to 0.85 for maskable safe zones) -->
  <g transform="translate(38, 38) scale(0.85)">
    <!-- Outer Decorative Planetary Ring/Orbit representing the "Sphere" environment -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="url(#orbitGrad)" stroke-width="4" stroke-dasharray="8 12" opacity="0.35" />
    <circle cx="256" cy="256" r="185" fill="none" stroke="url(#orbitGrad)" stroke-width="8" opacity="0.8" filter="url(#glow)" />

    <!-- Central Core Orb / Sphere -->
    <circle cx="256" cy="256" r="135" fill="url(#sphereGrad)" filter="url(#glow)" />

    <!-- Overlying Futuristic Tech Sheet / Document to symbolize Notes & Organization -->
    <g transform="translate(196, 185)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))">
      <!-- Folder/Document base -->
      <path d="M12,0 L84,0 C90,0 96,6 96,12 L96,118 C96,124 90,130 84,130 L12,130 C6,130 0,124 0,118 L0,12 C0,6 6,0 12,0 Z" fill="url(#docGrad)" />
      
      <!-- Folded page corner indicator -->
      <path d="M72,0 L96,24 L72,24 Z" fill="#818cf8" opacity="0.9" />

      <!-- Abstract high contrast neon lines inside the note document sheet -->
      <rect x="16" y="32" width="44" height="6" rx="3" fill="#4f46e5" />
      <rect x="16" y="52" width="64" height="6" rx="3" fill="#6366f1" opacity="0.8" />
      <rect x="16" y="72" width="56" height="6" rx="3" fill="#6366f1" opacity="0.8" />
      <rect x="16" y="92" width="40" height="6" rx="3" fill="#ec4899" opacity="0.9" />
    </g>

    <!-- Atomic Ring Overlay to give an extra futuristic feeling -->
    <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#orbitGrad)" stroke-width="6" transform="rotate(-30 256 256)" opacity="0.6" />
  </g>
</svg>
